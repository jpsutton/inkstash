# Publish on merge into main, without rebuilding: the pull request from staging already ran the
# full build (build.yml), so this takes that run's APK, signs it and releases it:
#   - zipalign + apksigner with the APK key (INKSTASH_APK_KEYSTORE). Android refuses an update
#     signed by another key, so it must never change. Without the secret the release is skipped.
#   - tag v<version> and a GitHub Release with inkstash-<version>.apk and
#     inkstash-<version>-mapping.txt (the R8 mapping, to decode crash traces; kept for good,
#     unlike the build artifact, which expires).
#   - the self-hosted F-Droid repository on GitHub Pages (gh-pages branch, /fdroid), signed with
#     INKSTASH_FDROID_KEYSTORE. Without that secret the release goes out without it.
#
# Merge staging -> main pull requests with "Create a merge commit": the PR's head is then the
# merge commit's second parent, which is what this looks up.
#
# workflow_dispatch is a dry run: it signs the APK of the given build run (or the newest build of
# this commit) and uploads the result as an artifact, without tagging or releasing.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run:
        description: "build.yml run ID to sign (default: the newest build of this commit)"
        required: false

permissions:
  contents: write   # tag, release and the gh-pages branch
  actions: read     # read the pull request's build run and its artifacts

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Creating the main branch is a push too; there is nothing to publish yet.
    if: ${{ !github.event.created }}
    runs-on: ubuntu-24.04
    # Includes waiting for the pull request's build to finish.
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_RUN: ${{ github.event.inputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find the build
        id: build
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            dry_run=false
            head=$(git rev-parse HEAD^2 2>/dev/null) || {
              echo "::error::$GITHUB_SHA is not a merge commit; merge staging into main with 'Create a merge commit'"
              exit 1
            }
            # The artifact was built from the PR head; it matches main only if the merge
            # changed nothing on top of it.
            if ! git diff --quiet "$head" HEAD; then
              echo "::error::main differs from the merged staging head $head; its build would not match"
              exit 1
            fi
            run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build.yml --commit "$head" \
                    --json databaseId,event \
                    -q 'map(select(.event == "pull_request")) | .[0].databaseId')
          else
            dry_run=true
            head=$GITHUB_SHA
            run=${INPUT_RUN:-$(gh run list -R "$GITHUB_REPOSITORY" --workflow build.yml --commit "$head" \
                                 --json databaseId -q '.[0].databaseId')}
          fi
          [ -n "$run" ] || { echo "::error::no build run for $head"; exit 1; }
          # Auto-merge can land the PR while the build is still running: wait for it.
          if [ "$(gh run view "$run" -R "$GITHUB_REPOSITORY" --json status -q .status)" != completed ]; then
            echo "Waiting for build run $run to finish"
            gh run watch "$run" -R "$GITHUB_REPOSITORY" --interval 60 >/dev/null || true
          fi
          [ "$(gh run view "$run" -R "$GITHUB_REPOSITORY" --json conclusion -q .conclusion)" = success ] || {
            echo "::error::build run $run did not succeed"
            exit 1
          }
          version=$(scripts/ci/version.sh)
          if [ "$dry_run" = false ] && git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released; bump VERSION_NAME in gradle.properties"
            exit 1
          fi
          {
            echo "run=$run"
            echo "version=$version"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"
          echo "Build run $run for $head, releasing v$version (dry run: $dry_run)" >> "$GITHUB_STEP_SUMMARY"

      # Always signed with the same key: Android refuses an update signed by another one.
      - name: Sign the APK
        id: apk
        env:
          KEYSTORE: ${{ secrets.INKSTASH_APK_KEYSTORE }}
          KEYSTORE_PASS: ${{ secrets.INKSTASH_APK_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE" ]; then
            echo "::error::INKSTASH_APK_KEYSTORE is not set; see 'Release keys' in the README"
            exit 1
          fi
          gh run download "${{ steps.build.outputs.run }}" -R "$GITHUB_REPOSITORY" -n inkstash-android -D android
          gh run download "${{ steps.build.outputs.run }}" -R "$GITHUB_REPOSITORY" -n inkstash-mapping -D mapping
          mkdir -p dist
          unsigned=$(find android -name '*.apk' | head -n 1)
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/apk.p12"
          out="dist/inkstash-${{ steps.build.outputs.version }}.apk"
          "$tools/zipalign" -p -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/apk.p12" --ks-type PKCS12 --ks-pass env:KEYSTORE_PASS \
            --out "$out" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify "$out"
          rm -f "$RUNNER_TEMP/apk.p12" "$out.idsig"
          echo "apk=$out" >> "$GITHUB_OUTPUT"
          # The mapping of this exact APK; the signature does not change the code.
          cp mapping/mapping.txt "dist/inkstash-${{ steps.build.outputs.version }}-mapping.txt"
          echo "mapping=dist/inkstash-${{ steps.build.outputs.version }}-mapping.txt" >> "$GITHUB_OUTPUT"

      - name: Upload the dry run
        if: steps.build.outputs.dry_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run
          path: dist/*
          retention-days: 7
          compression-level: 0

      - name: Tag
        if: steps.build.outputs.dry_run == 'false'
        run: |
          set -euo pipefail
          git tag "v${{ steps.build.outputs.version }}" "$GITHUB_SHA"
          git push origin "v${{ steps.build.outputs.version }}"

      - name: GitHub Release
        if: steps.build.outputs.dry_run == 'false'
        run: |
          set -euo pipefail
          gh release create "v${{ steps.build.outputs.version }}" -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "inkstash ${{ steps.build.outputs.version }}" \
            --generate-notes "${{ steps.apk.outputs.apk }}" "${{ steps.apk.outputs.mapping }}"

      # The self-hosted F-Droid repository on GitHub Pages (gh-pages branch, /fdroid).
      - name: F-Droid repository
        if: steps.build.outputs.dry_run == 'false'
        env:
          INKSTASH_FDROID_KEYSTORE: ${{ secrets.INKSTASH_FDROID_KEYSTORE }}
          INKSTASH_FDROID_KEYSTORE_PASS: ${{ secrets.INKSTASH_FDROID_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          if [ -z "$INKSTASH_FDROID_KEYSTORE" ]; then
            echo "::warning::INKSTASH_FDROID_KEYSTORE is not set; the F-Droid repository was not updated"
            exit 0
          fi
          # Ubuntu's fdroidserver (2.2) can't read current APKs.
          pipx install fdroidserver==2.4.5
          scripts/ci/fdroid-repo.sh "${{ steps.apk.outputs.apk }}"
